<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas 💛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #090a0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            color: #ffeb3b;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 235, 59, 0.7);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #d1d5db;
            margin-bottom: 10px;
        }

        canvas {
            background: transparent;
            touch-action: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Para Alguien Especial 💛</h1>
        <p class="subtitle">Floreciendo para ti...</p>
        <canvas id="flowerCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = Math.min(window.innerWidth, 450);
            canvas.height = Math.min(window.innerHeight * 0.75, 500);
        }
        resizeCanvas();

        let progress = 0; // Control de progreso general de la animación (0 a 100)

        // Dibujar un girasol pequeño de fondo
        function drawBgSunflower(x, y, maxRadius, currentProgress) {
            const radius = maxRadius * currentProgress;
            if (radius <= 0) return;

            const petals = 10;
            const angleStep = (Math.PI * 2) / petals;

            for (let i = 0; i < petals; i++) {
                const angle = i * angleStep;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.ellipse(0, -radius * 0.7, radius * 0.3, radius * 0.6, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#fbc02d';
                ctx.fill();
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(x, y, radius * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = '#4e342e';
            ctx.fill();
        }

        // Dibujar hoja
        function drawLeaf(x, y, size, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.ellipse(0, 0, size, size / 2.8, 0, 0, Math.PI * 2);
            const leafGrad = ctx.createLinearGradient(-size, 0, size, 0);
            leafGrad.addColorStop(0, '#4caf50');
            leafGrad.addColorStop(1, '#1b5e20');
            ctx.fillStyle = leafGrad;
            ctx.fill();
            ctx.restore();
        }

        // Dibujar flor del ramo principal
        function drawMainFlower(x, y, maxRadius, petalCount, curveOffset, currentProgress) {
            const radius = maxRadius * currentProgress;
            if (radius <= 0) return;

            // Tallo creciente
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x + curveOffset, y + (90 * currentProgress), x, y + (200 * currentProgress));
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#2e7d32';
            ctx.lineCap = 'round';
            ctx.stroke();

            // Hojas
            if (currentProgress > 0.4) {
                drawLeaf(x + (curveOffset > 0 ? 12 : -12), y + 70, 28 * currentProgress, curveOffset > 0 ? Math.PI / 4 : -Math.PI / 4);
                drawLeaf(x + (curveOffset > 0 ? -8 : 8), y + 120, 24 * currentProgress, curveOffset > 0 ? -Math.PI / 3 : Math.PI / 3);
            }

            // Pétalos que se van abriendo
            const angleStep = (Math.PI * 2) / petalCount;
            for (let i = 0; i < petalCount; i++) {
                const angle = i * angleStep;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(radius * 0.45, -radius * 0.35, 0, -radius);
                ctx.quadraticCurveTo(-radius * 0.45, -radius * 0.35, 0, 0);

                const petalGrad = ctx.createRadialGradient(0, 0, 4, 0, -radius, radius);
                petalGrad.addColorStop(0, '#ffeb3b');
                petalGrad.addColorStop(0.8, '#fbc02d');
                petalGrad.addColorStop(1, '#fffde7');

                ctx.fillStyle = petalGrad;
                ctx.shadowColor = 'rgba(255, 193, 7, 0.5)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.restore();
            }

            // Centro
            ctx.beginPath();
            ctx.arc(x, y, radius * 0.35, 0, Math.PI * 2);
            ctx.fillStyle = '#3e2723';
            ctx.fill();
        }

        // Coordenadas fijas para el fondo
        const bgSunflowers = [
            {x: 50, y: 80, r: 20}, {x: 380, y: 60, r: 25},
            {x: 80, y: 400, r: 22}, {x: 360, y: 420, r: 18},
            {x: 40, y: 240, r: 18}, {x: 400, y: 220, r: 20},
            {x: 200, y: 50, r: 15}, {x: 220, y: 440, r: 16}
        ];

        // Bucle de animación garantizado mediante setInterval
        const animationTimer = setInterval(() => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Dibujar girasoles de fondo progresivos
            bgSunflowers.forEach(sf => {
                drawBgSunflower(sf.x, sf.y, sf.r, Math.min(progress / 50, 1));
            });

            // 2. Dibujar ramo de flores principales tras cierto avance
            if (progress > 20) {
                const bouquetProgress = (progress - 20) / 80; // Escala de 0 a 1
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2 - 10;

                drawMainFlower(centerX - 60, centerY + 30, 40, 10, 15, bouquetProgress);
                drawMainFlower(centerX + 60, centerY + 35, 38, 10, -15, bouquetProgress);
                drawMainFlower(centerX, centerY - 20, 55, 12, 5, bouquetProgress);
            }

            // Incrementar progreso hasta completar
            if (progress < 100) {
                progress += 1;
            } else {
                clearInterval(animationTimer); // Detener el reloj al terminar para ahorrar recursos
            }
        }, 30); // Actualiza cada 30 milisegundos
    </script>
</body>
</html>
