<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas 💛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1a233a 0%, #080c14 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 10px;
        }

        h1 {
            color: #ffeb3b;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(255, 235, 59, 0.6);
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #b0bec5;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        canvas {
            background: transparent;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            touch-action: none;
        }

        p.footer {
            margin-top: 12px;
            font-size: 0.75rem;
            color: #78909c;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Para Alguien Especial 💛</h1>
        <p class="subtitle">Un detalle que nunca se marchita</p>
        
        <canvas id="flowerCanvas" width="360" height="460"></canvas>
        
        <p class="footer">Toca la pantalla para regenerar destellos</p>
    </div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        // Partículas de luz / Destellos
        let particles = [];

        function createParticles() {
            particles = [];
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 2 + 1,
                    alpha: Math.random() * 0.8 + 0.2,
                    speedY: Math.random() * -0.5 - 0.2,
                    speedX: (Math.random() - 0.5) * 0.3
                });
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 235, 59, ${p.alpha})`;
                ctx.shadowColor = '#ffeb3b';
                ctx.shadowBlur = 8;
                ctx.fill();

                p.y += p.speedY;
                p.x += p.speedX;

                if (p.y < 0) {
                    p.y = canvas.height;
                    p.x = Math.random() * canvas.width;
                }
            });
            ctx.shadowBlur = 0; // Resetear sombra
        }

        // Dibujo de hojas detalladas
        function drawLeaf(x, y, size, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.ellipse(0, 0, size, size / 2.8, 0, 0, Math.PI * 2);

            const leafGrad = ctx.createLinearGradient(-size, 0, size, 0);
            leafGrad.addColorStop(0, '#4caf50');
            leafGrad.addColorStop(0.5, '#2e7d32');
            leafGrad.addColorStop(1, '#1b5e20');

            ctx.fillStyle = leafGrad;
            ctx.fill();

            // Nervadura de la hoja
            ctx.beginPath();
            ctx.moveTo(-size * 0.8, 0);
            ctx.lineTo(size * 0.8, 0);
            ctx.strokeStyle = '#81c784';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.restore();
        }

        // Dibujo de pétalos con degradado y capas
        function drawPetals(x, y, radius, count, colorInner, colorOuter) {
            const angleStep = (Math.PI * 2) / count;

            for (let i = 0; i < count; i++) {
                const angle = i * angleStep;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(radius * 0.45, -radius * 0.35, 0, -radius);
                ctx.quadraticCurveTo(-radius * 0.45, -radius * 0.35, 0, 0);

                const petalGrad = ctx.createRadialGradient(0, 0, 4, 0, -radius, radius);
                petalGrad.addColorStop(0, colorInner);
                petalGrad.addColorStop(0.75, colorOuter);
                petalGrad.addColorStop(1, '#fffde7');

                ctx.fillStyle = petalGrad;
                ctx.shadowColor = 'rgba(255, 193, 7, 0.4)';
                ctx.shadowBlur = 6;
                ctx.fill();

                ctx.restore();
            }
        }

        // Centro con textura de polen
        function drawFlowerCenter(x, y, centerRadius) {
            ctx.beginPath();
            ctx.arc(x, y, centerRadius, 0, Math.PI * 2);

            const centerGrad = ctx.createRadialGradient(x, y, 2, x, y, centerRadius);
            centerGrad.addColorStop(0, '#795548');
            centerGrad.addColorStop(0.65, '#4e342e');
            centerGrad.addColorStop(1, '#261713');

            ctx.fillStyle = centerGrad;
            ctx.fill();

            // Granos de polen
            for (let i = 0; i < 35; i++) {
                const r = Math.random() * (centerRadius - 2);
                const theta = Math.random() * Math.PI * 2;
                ctx.beginPath();
                ctx.arc(x + r * Math.cos(theta), y + r * Math.sin(theta), 1.2, 0, Math.PI * 2);
                ctx.fillStyle = '#ffe082';
                ctx.fill();
            }
        }

        // Flor completa con tallo curvo
        function drawYellowFlower(x, y, radius, petalCount, curveOffset) {
            // Tallo
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x + curveOffset, y + 90, x, y + 210);
            ctx.lineWidth = 7;
            ctx.strokeStyle = '#2e7d32';
            ctx.lineCap = 'round';
            ctx.stroke();

            // Hojas a los lados
            drawLeaf(x + (curveOffset > 0 ? 12 : -12), y + 70, 32, curveOffset > 0 ? Math.PI / 4 : -Math.PI / 4);
            drawLeaf(x + (curveOffset > 0 ? -8 : 8), y + 130, 28, curveOffset > 0 ? -Math.PI / 3 : Math.PI / 3);

            // Capa trasera de pétalos (profundidad)
            drawPetals(x, y, radius * 1.06, petalCount, '#fbc02d', '#f57f17');

            // Capa principal de pétalos (amarillo brillante)
            drawPetals(x, y, radius, petalCount, '#ffeb3b', '#fbc02d');

            // Centro
            drawFlowerCenter(x, y, radius * 0.35);
        }

        // Renderizado continuo
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Partículas flotantes de fondo
            drawParticles();

            // Ramo de flores
            drawYellowFlower(110, 230, 42, 10, 20);  // Flor Izquierda
            drawYellowFlower(250, 240, 40, 10, -20); // Flor Derecha
            drawYellowFlower(180, 160, 58, 12, 5);   // Flor Central Principal

            requestAnimationFrame(animate);
        }

        // Inicializar
        createParticles();
        animate();

        // Evento al tocar/hacer clic
        canvas.addEventListener('click', () => {
            createParticles();
        });
    </script>
</body>
</html>
