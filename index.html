<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
        }

        .title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ffeb3b;
            text-shadow: 0 0 12px rgba(255, 235, 59, 0.6);
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #d1d5db;
            margin-top: 10px;
            opacity: 0.8;
            text-align: center;
        }

        canvas {
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.3));
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <h1 class="title">Para Alguien Especial 💛</h1>
        <canvas id="flowerCanvas"></canvas>
        <p class="subtitle">Haz clic para florecer de nuevo</p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('flowerCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = Math.min(window.innerWidth * 0.9, 450);
                canvas.height = Math.min(window.innerHeight * 0.65, 500);
            }
            resizeCanvas();

            function drawLeaf(x, y, size, angle) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.ellipse(0, 0, size, size / 3, 0, 0, Math.PI * 2);
                const leafGrad = ctx.createLinearGradient(-size, 0, size, 0);
                leafGrad.addColorStop(0, '#388e3c');
                leafGrad.addColorStop(1, '#1b5e20');
                ctx.fillStyle = leafGrad;
                ctx.fill();
                ctx.restore();
            }

            function drawPetals(x, y, radius, count, colorStart, colorEnd) {
                const angleStep = (Math.PI * 2) / count;
                for (let i = 0; i < count; i++) {
                    const angle = i * angleStep;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(angle);

                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(radius * 0.4, -radius * 0.3, 0, -radius);
                    ctx.quadraticCurveTo(-radius * 0.4, -radius * 0.3, 0, 0);

                    const petalGradient = ctx.createRadialGradient(0, 0, 5, 0, -radius, radius);
                    petalGradient.addColorStop(0, colorStart);
                    petalGradient.addColorStop(0.8, colorEnd);
                    petalGradient.addColorStop(1, '#fff59d');

                    ctx.fillStyle = petalGradient;
                    ctx.fill();
                    ctx.restore();
                }
            }

            function drawFlowerCenter(x, y, centerRadius) {
                ctx.beginPath();
                ctx.arc(x, y, centerRadius, 0, Math.PI * 2);
                const centerGrad = ctx.createRadialGradient(x, y, 2, x, y, centerRadius);
                centerGrad.addColorStop(0, '#8d6e63');
                centerGrad.addColorStop(0.6, '#5d4037');
                centerGrad.addColorStop(1, '#3e2723');
                ctx.fillStyle = centerGrad;
                ctx.fill();

                for (let i = 0; i < 35; i++) {
                    const r = Math.random() * (centerRadius - 2);
                    const theta = Math.random() * Math.PI * 2;
                    ctx.beginPath();
                    ctx.arc(x + r * Math.cos(theta), y + r * Math.sin(theta), 1.2, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffb74d';
                    ctx.fill();
                }
            }

            function drawYellowFlower(x, y, radius, petalCount) {
                // Tallo
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.quadraticCurveTo(x + 20, y + 100, x - 5, y + 250);
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#2d5a27';
                ctx.lineCap = 'round';
                ctx.stroke();

                // Hojas
                drawLeaf(x + 10, y + 80, 35, Math.PI / 4);
                drawLeaf(x + 5, y + 140, 35, -Math.PI / 3);

                // Pétalos y Centro
                drawPetals(x, y, radius * 1.05, petalCount, '#fbc02d', '#f57f17');
                drawPetals(x, y, radius, petalCount, '#ffeb3b', '#fbc02d');
                drawFlowerCenter(x, y, radius * 0.35);
            }

            function renderScene() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2 - 20;

                drawYellowFlower(centerX - 55, centerY + 30, 45, 10);
                drawYellowFlower(centerX + 55, centerY + 40, 40, 10);
                drawYellowFlower(centerX, centerY - 25, 60, 12);
            }

            renderScene();
            canvas.addEventListener('click', renderScene);
            window.addEventListener('resize', () => {
                resizeCanvas();
                renderScene();
            });
        });
    </script>
</body>
</html>
