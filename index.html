<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas 💛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #07090e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            color: #ffeb3b;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 235, 59, 0.8);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #d1d5db;
            margin-bottom: 10px;
        }

        canvas {
            background: transparent;
            touch-action: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Para Alguien Especial 💛</h1>
        <p class="subtitle">Un jardín entero floreciendo para ti...</p>
        <canvas id="flowerCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = Math.min(window.innerWidth, 480);
            canvas.height = Math.min(window.innerHeight * 0.78, 540);
        }
        resizeCanvas();

        let progress = 0;

        // Generar matriz densa de girasoles de fondo (45 girasoles distribuidos)
        const bgSunflowers = [];
        for (let i = 0; i < 45; i++) {
            bgSunflowers.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 14 + 10,
                delay: Math.random() * 30 // Diferentes tiempos de brote
            });
        }

        // Dibujar girasol de fondo
        function drawBgSunflower(x, y, maxRadius, p) {
            if (p <= 0) return;
            const radius = maxRadius * p;
            const petals = 10;
            const angleStep = (Math.PI * 2) / petals;

            for (let i = 0; i < petals; i++) {
                const angle = i * angleStep;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.ellipse(0, -radius * 0.7, radius * 0.3, radius * 0.6, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#fbc02d';
                ctx.fill();
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(x, y, radius * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = '#3e2723';
            ctx.fill();
        }

        // Dibujar hoja
        function drawLeaf(x, y, size, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.ellipse(0, 0, size, size / 2.8, 0, 0, Math.PI * 2);
            const leafGrad = ctx.createLinearGradient(-size, 0, size, 0);
            leafGrad.addColorStop(0, '#4caf50');
            leafGrad.addColorStop(1, '#1b5e20');
            ctx.fillStyle = leafGrad;
            ctx.fill();
            ctx.restore();
        }

        // Dibujar flor principal del ramo
        function drawMainFlower(x, y, maxRadius, petalCount, curveOffset, currentProgress) {
            const radius = maxRadius * currentProgress;
            if (radius <= 0) return;

            // Tallo creciente
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x + curveOffset, y + (80 * currentProgress), x, y + (190 * currentProgress));
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#2e7d32';
            ctx.lineCap = 'round';
            ctx.stroke();

            // Hojas
            if (currentProgress > 0.3) {
                drawLeaf(x + (curveOffset > 0 ? 10 : -10), y + 60, 26 * currentProgress, curveOffset > 0 ? Math.PI / 4 : -Math.PI / 4);
                drawLeaf(x + (curveOffset > 0 ? -6 : 6), y + 110, 22 * currentProgress, curveOffset > 0 ? -Math.PI / 3 : Math.PI / 3);
            }

            // Pétalos que se van abriendo
            const angleStep = (Math.PI * 2) / petalCount;
            for (let i = 0; i < petalCount; i++) {
                const angle = i * angleStep;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(radius * 0.45, -radius * 0.35, 0, -radius);
                ctx.quadraticCurveTo(-radius * 0.45, -radius * 0.35, 0, 0);

                const petalGrad = ctx.createRadialGradient(0, 0, 4, 0, -radius, radius);
                petalGrad.addColorStop(0, '#ffeb3b');
                petalGrad.addColorStop(0.8, '#fbc02d');
                petalGrad.addColorStop(1, '#fffde7');

                ctx.fillStyle = petalGrad;
                ctx.shadowColor = 'rgba(255, 193, 7, 0.5)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.restore();
            }

            // Centro
            ctx.beginPath();
            ctx.arc(x, y, radius * 0.35, 0, Math.PI * 2);
            ctx.fillStyle = '#3e2723';
            ctx.fill();
        }

        // Bucle de animación garantizado mediante setInterval
        const animationTimer = setInterval(() => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Llenar el fondo con muchos girasoles brotando
            bgSunflowers.forEach(sf => {
                if (progress > sf.delay) {
                    const localProgress = Math.min((progress - sf.delay) / 40, 1);
                    drawBgSunflower(sf.x, sf.y, sf.r, localProgress);
                }
            });

            // 2. Dibujar ramo principal de 5 flores
            if (progress > 15) {
                const bP = Math.min((progress - 15) / 85, 1); // Progreso del ramo
                const cX = canvas.width / 2;
                const cY = canvas.height / 2 - 10;

                // Flores traseras del ramo
                drawMainFlower(cX - 80, cY + 55, 35, 10, 20, bP);
                drawMainFlower(cX + 80, cY + 60, 33, 10, -20, bP);

                // Flores medias del ramo
                drawMainFlower(cX - 45, cY + 20, 42, 10, 10, bP);
                drawMainFlower(cX + 45, cY + 25, 40, 10, -10, bP);

                // Flor central principal grande
                drawMainFlower(cX, cY - 35, 56, 12, 0, bP);
            }

            // Incrementar progreso
            if (progress < 100) {
                progress += 1;
            } else {
                clearInterval(animationTimer);
            }
        }, 30);
    </script>
</body>
</html>
